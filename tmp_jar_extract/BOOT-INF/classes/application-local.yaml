--- #################### 鏁版嵁搴撶浉鍏抽厤缃?####################
spring:
  # 鏁版嵁婧愰厤缃」
  autoconfigure:
    exclude:
  datasource:
    druid: # Druid 銆愮洃鎺с€戠浉鍏崇殑鍏ㄥ眬閰嶇疆
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        enabled: true
        allow: # 璁剧疆鐧藉悕鍗曪紝涓嶅～鍒欏厑璁告墍鏈夎闂?
        url-pattern: /druid/*
        login-username: # 鎺у埗鍙扮鐞嗙敤鎴峰悕鍜屽瘑鐮?
        login-password:
      filter:
        stat:
          enabled: true
          log-slow-sql: true # 鎱?SQL 璁板綍
          slow-sql-millis: 100
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
    dynamic: # 澶氭暟鎹簮閰嶇疆
      druid: # Druid 銆愯繛鎺ユ睜銆戠浉鍏崇殑鍏ㄥ眬閰嶇疆
        initial-size: 1 # 鍒濆杩炴帴鏁?
        min-idle: 1 # 鏈€灏忚繛鎺ユ睜鏁伴噺
        max-active: 20 # 鏈€澶ц繛鎺ユ睜鏁伴噺
        max-wait: 60000 # 閰嶇疆鑾峰彇杩炴帴绛夊緟瓒呮椂鐨勬椂闂达紝鍗曚綅锛氭绉掞紙1 鍒嗛挓锛?
        time-between-eviction-runs-millis: 60000 # 閰嶇疆闂撮殧澶氫箙鎵嶈繘琛屼竴娆℃娴嬶紝妫€娴嬮渶瑕佸叧闂殑绌洪棽杩炴帴锛屽崟浣嶏細姣锛? 鍒嗛挓锛?
        min-evictable-idle-time-millis: 600000 # 閰嶇疆涓€涓繛鎺ュ湪姹犱腑鏈€灏忕敓瀛樼殑鏃堕棿锛屽崟浣嶏細姣锛?0 鍒嗛挓锛?
        max-evictable-idle-time-millis: 1800000 # 閰嶇疆涓€涓繛鎺ュ湪姹犱腑鏈€澶х敓瀛樼殑鏃堕棿锛屽崟浣嶏細姣锛?0 鍒嗛挓锛?
        validation-query: SELECT 1 FROM DUAL # 閰嶇疆妫€娴嬭繛鎺ユ槸鍚︽湁鏁?
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        pool-prepared-statements: true # 鏄惁寮€鍚?PreparedStatement 缂撳瓨
        max-pool-prepared-statement-per-connection-size: 20 # 姣忎釜杩炴帴缂撳瓨鐨?PreparedStatement 鏁伴噺
      primary: master
      datasource:
        master:
          url: jdbc:mysql://127.0.0.1:3306/shenyudb?useSSL=false&serverTimezone=Asia/Shanghai&useTimeZone=true&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true&java.net.preferIPv4Stack=true # MySQL Connector/J 8.X 杩炴帴鐨勭ず渚?
          #          url: jdbc:mysql://192.168.10.47:3306/football-saas?useSSL=true&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true # MySQL Connector/J 5.X 杩炴帴鐨勭ず渚?
          #          url: jdbc:postgresql://192.168.10.47:5432/ruoyi-vue-pro # PostgreSQL 杩炴帴鐨勭ず渚?
          #          url: jdbc:oracle:thin:@192.168.10.47:1521:xe # Oracle 杩炴帴鐨勭ず渚?
          #          url: jdbc:sqlserver://192.168.10.47:1433;DatabaseName=ruoyi-vue-pro # SQLServer 杩炴帴鐨勭ず渚?
          #          url: jdbc:dm://10.211.55.4:5236?schema=RUOYI_VUE_PRO # DM 杩炴帴鐨勭ず渚?
          username: root
          password: 'root'
        #          username: sa # SQL Server 杩炴帴鐨勭ず渚?
        #          password: JSm:g(*%lU4ZAkz06cd52KqT3)i1?H7W # SQL Server 杩炴帴鐨勭ず渚?
        #          username: SYSDBA # DM 杩炴帴鐨勭ず渚?
        #          password: SYSDBA # DM 杩炴帴鐨勭ず渚?
