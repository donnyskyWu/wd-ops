# Optional profile: point OPS five-DB multidb + Redis (+ Nacos hints) to beta test host 110.42.49.224
# Does NOT replace default local multidb. Activate AFTER base profiles, e.g.:
#   -Dspring-boot.run.profiles=dev,dev-nacos,dev-nacos-local,dev-local-multidb,dev-test-beta
#
# Prefer loading passwords from scripts/integration-config/ops-test-remote.env (gitignored)
# before start. Defaults below use CHANGE_ME so missing env fails closed for secrets.
# bpm: not wired in OPS oa-server dynamic DS (Football bpm-server uses OPS_TEST_BPM_* in overlay).
# See docs/delivery/OPS-TEST-DB.md

oa:
  auth:
    football-redis:
      enabled: true
      host: ${OPS_TEST_REDIS_HOST:110.42.49.224}
      port: ${OPS_TEST_REDIS_PORT:6379}
      database: ${OPS_TEST_REDIS_DATABASE:1}
      password: ${OPS_TEST_REDIS_PASSWORD:CHANGE_ME}

spring:
  cloud:
    nacos:
      server-addr: ${OPS_TEST_NACOS_ADDR:110.42.49.224:8848}
      username: ${OPS_TEST_NACOS_USERNAME:nacos}
      password: ${OPS_TEST_NACOS_PASSWORD:CHANGE_ME}
      discovery:
        namespace: ${OPS_TEST_NACOS_NAMESPACE:beta}
        group: ${OPS_TEST_NACOS_GROUP:DEFAULT_GROUP}
      config:
        namespace: ${OPS_TEST_NACOS_NAMESPACE:beta}
        group: ${OPS_TEST_NACOS_GROUP:DEFAULT_GROUP}
  data:
    redis:
      host: ${OPS_TEST_REDIS_HOST:110.42.49.224}
      port: ${OPS_TEST_REDIS_PORT:6379}
      database: ${OPS_TEST_REDIS_DATABASE:1}
      password: ${OPS_TEST_REDIS_PASSWORD:CHANGE_ME}
  datasource:
    url: jdbc:mysql://110.42.49.224:3306/shenyu-ops?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: shenyu-ops
    password: ${OPS_TEST_MASTER_PASSWORD:${OPS_WD_TEST_PASSWORD:CHANGE_ME}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: jdbc:mysql://110.42.49.224:3306/shenyu-ops?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
          username: shenyu-ops
          password: ${OPS_TEST_MASTER_PASSWORD:${OPS_WD_TEST_PASSWORD:CHANGE_ME}}
          driver-class-name: com.mysql.cj.jdbc.Driver
        system:
          url: jdbc:mysql://110.42.49.224:3306/shenyu-system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
          username: shenyu-system
          password: ${OPS_TEST_SYSTEM_PASSWORD:CHANGE_ME}
          driver-class-name: com.mysql.cj.jdbc.Driver
        member:
          url: jdbc:mysql://110.42.49.224:3306/shenyu-member?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
          username: shenyu-member
          password: ${OPS_TEST_MEMBER_PASSWORD:CHANGE_ME}
          driver-class-name: com.mysql.cj.jdbc.Driver
        mp:
          url: jdbc:mysql://110.42.49.224:3306/shenyu-mp?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
          username: shenyu-mp
          password: ${OPS_TEST_MP_PASSWORD:CHANGE_ME}
          driver-class-name: com.mysql.cj.jdbc.Driver
        pay:
          url: jdbc:mysql://110.42.49.224:3306/shenyu-pay?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
          username: shenyu-pay
          password: ${OPS_TEST_PAY_PASSWORD:CHANGE_ME}
          driver-class-name: com.mysql.cj.jdbc.Driver
