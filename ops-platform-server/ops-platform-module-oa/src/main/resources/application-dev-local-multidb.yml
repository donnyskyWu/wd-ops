# Local multidb profile (ADR-050 §4). Activate with profile dev-local-multidb.
# Usage: mvn spring-boot:run "-Dspring-boot.run.profiles=dev,dev-nacos,dev-nacos-local,dev-local-multidb"
#
# C-WP7 cutover (2026-07-29):
# - member / mp / pay / system 已 Feign-only 或移除 multidb
# - legacy @DS token 仅 IT：oa.auth.legacy-ds-token.enabled=true
oa:
  auth:
    gateway-login-user:
      enabled: true
    legacy-ds-token:
      enabled: true
    football-redis:
      enabled: true
      host: 127.0.0.1
      port: 6379
      database: 0
      password: "123456"

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/wd?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: jdbc:mysql://localhost:3306/wd?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
          username: root
          password: root
          driver-class-name: com.mysql.cj.jdbc.Driver
