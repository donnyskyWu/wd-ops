# Local five-database profile (ADR-050 §4). Activate with profile dev-local-multidb.
# Usage: mvn spring-boot:run "-Dspring-boot.run.profiles=dev,dev-nacos,dev-nacos-local,dev-local-multidb"
oa:
  auth:
    football-redis:
      enabled: true
      host: 127.0.0.1
      port: 6379
      database: 0
      password: "123456"

spring:
