# Optional profile: point OPS master datasource to test remote shenyu-ops.
# Does NOT replace default local multidb. Activate AFTER dev-local-multidb, e.g.:
#   -Dspring-boot.run.profiles=dev,dev-nacos,dev-nacos-local,dev-local-multidb,dev-test-remote-wd
#
# Prefer filling password from scripts/integration-config/wd-test-remote.env (gitignored).
# See docs/delivery/OPS-TEST-DB.md

spring:
  datasource:
    url: jdbc:mysql://110.42.49.224:3306/shenyu-ops?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: shenyu-ops
    password: ${OPS_WD_TEST_PASSWORD:CHANGE_ME}
    driver-class-name: com.mysql.cj.jdbc.Driver
    dynamic:
      datasource:
        master:
          url: jdbc:mysql://110.42.49.224:3306/shenyu-ops?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
          username: shenyu-ops
          password: ${OPS_WD_TEST_PASSWORD:CHANGE_ME}
          driver-class-name: com.mysql.cj.jdbc.Driver
