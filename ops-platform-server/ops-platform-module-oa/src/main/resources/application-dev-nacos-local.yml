# Override Nacos server for local Docker (scripts/start-nacos-local.ps1).
# Run: mvn spring-boot:run "-Dspring-boot.run.profiles=dev,dev-nacos,dev-nacos-local"
#
# Phase C cutover (2026-07-29): G-* 业务域 Feign-only；Feign 不可用时 fail-fast（不再 @DS 回退）。
# pay-server 默认 Integration 脚本未启 — G-PAY-01 须单独启动 :48085 JAR。

spring:
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      username: ""
      password: ""
      discovery:
        namespace: local
        fail-fast: false
        failure-tolerance-enabled: true
    # AL-05: direct Football RPC URLs for local integration (see football-integration-overlay.yml).
    # system-server has 4 Feign clients — each needs a unique contextId (see @FeignClient on *Api).
    openfeign:
      client:
        config:
          operateLogCommonApi:
            url: http://127.0.0.1:48081
          adminUserApi:
            url: http://127.0.0.1:48081
          permissionCommonApi:
            url: http://127.0.0.1:48081
          dictDataApi:
            url: http://127.0.0.1:48081
          member-server:
            url: http://127.0.0.1:48087
          mp-server:
            url: http://127.0.0.1:48086
          infra-server:
            url: http://127.0.0.1:48082
          pay-server:
            url: http://127.0.0.1:48085
