<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P-FT-006 推送规则编辑 Drawer DRW-PUSH-RULE</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="app-layout" style="filter: blur(1px); opacity: .6; pointer-events: none;">
    <aside class="sidebar"><div class="sidebar-logo">Football Admin</div></aside>
    <div class="main-wrap"><header class="topbar"><div class="breadcrumb">系统管理 / 消息中心</div></header></div>
  </div>

  <div class="overlay">
    <aside class="drawer w600">
      <div class="drawer-header">
        <h3>编辑规则</h3>
        <button class="drawer-close" onclick="location.href='notify-dingtalk-push.html'">×</button>
      </div>

      <div class="drawer-body">
        <!-- 基础 -->
        <div class="section-title">基础</div>
        <div class="form-item">
          <label class="form-label required">规则名称</label>
          <div class="form-control"><input class="input" value="晨会日报提醒"></div>
        </div>
        <div class="form-item">
          <label class="form-label">启用</label>
          <div class="form-control"><span class="switch on"></span></div>
        </div>

        <!-- 受众 -->
        <div class="section-title">受众</div>
        <div class="form-item">
          <label class="form-label required">目标角色</label>
          <div class="form-control">
            <select class="select" multiple style="height:72px;">
              <option selected>运营组长</option>
              <option selected>运营人员</option>
              <option>租户管理员</option>
              <option>普通角色</option>
            </select>
            <div class="form-hint">RoleSelect 多选 · 必填</div>
          </div>
        </div>

        <!-- 调度 -->
        <div class="section-title">调度</div>
        <div class="form-item">
          <label class="form-label required">Cron 表达式</label>
          <div class="form-control">
            <div style="display:flex;gap:8px;">
              <input class="input" value="0 0 9 * * ?" style="flex:1;">
              <select class="select" style="width:140px;">
                <option>常用模板</option>
                <option selected>每日 9 点</option>
                <option>每周一 9 点</option>
                <option>每月 1 号</option>
              </select>
            </div>
            <div class="form-hint">人类可读：每日 09:00</div>
          </div>
        </div>

        <!-- 通道 -->
        <div class="section-title">通道</div>
        <div class="form-item">
          <label class="form-label required">推送通道</label>
          <div class="form-control">
            <div class="radio-group">
              <label><input type="radio" name="channel" checked> 工作通知</label>
              <label><input type="radio" name="channel"> Webhook</label>
              <label><input type="radio" name="channel"> 双通道</label>
            </div>
          </div>
        </div>
        <div class="form-item" style="opacity:.45;">
          <label class="form-label">Webhook URL</label>
          <div class="form-control">
            <input class="input" placeholder="https://oapi.dingtalk.com/robot/send?access_token=..." disabled>
            <div class="form-hint">通道含 Webhook 时显示且必填</div>
          </div>
        </div>
        <div class="form-item" style="opacity:.45;">
          <label class="form-label">Webhook Secret</label>
          <div class="form-control">
            <input class="input" type="password" placeholder="选填，加签 Secret" disabled>
          </div>
        </div>

        <!-- 内容 -->
        <div class="section-title">内容</div>
        <div class="form-item">
          <label class="form-label required">消息类型</label>
          <div class="form-control">
            <select class="select" style="width:200px;">
              <option selected>TEXT</option>
              <option>MARKDOWN</option>
              <option>LINK</option>
            </select>
          </div>
        </div>
        <div class="form-item" style="opacity:.45;">
          <label class="form-label">标题</label>
          <div class="form-control">
            <input class="input" placeholder="LINK 类型时必填" disabled>
          </div>
        </div>
        <div class="form-item">
          <label class="form-label required">模板</label>
          <div class="form-control">
            <textarea class="textarea" rows="4">【日报提醒】{{date}} 请各位准时提交今日工作总结。
当前角色：{{roleName}}，待处理人数：{{userCount}}</textarea>
            <div class="form-hint">支持占位符：{{date}} {{roleName}} {{userCount}}</div>
          </div>
        </div>
        <div class="form-item">
          <label class="form-label">关联站内模板</label>
          <div class="form-control">
            <select class="select">
              <option value="">— 不关联 —</option>
              <option selected>日报提醒模板 (notify_daily_report)</option>
              <option>系统通知模板</option>
            </select>
            <div class="form-hint">NotifyTemplateSelect · 选中后填充 content</div>
          </div>
        </div>

        <!-- 高级 -->
        <div class="section-title">高级</div>
        <div class="form-item">
          <label class="form-label">去重键</label>
          <div class="form-control">
            <input class="input" value="daily_report_{{date}}">
            <div class="form-hint">同日同规则仅推一次</div>
          </div>
        </div>
      </div>

      <div class="drawer-footer">
        <button class="btn" onclick="location.href='notify-dingtalk-push.html'">取消</button>
        <button class="btn">测试推送</button>
        <button class="btn btn-primary">保存</button>
      </div>
    </aside>
  </div>

  <!-- 新增规则变体提示 -->
  <div style="position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--el-border-color-light);border-radius:4px;padding:12px 20px;box-shadow:0 2px 12px rgba(0,0,0,.1);font-size:13px;z-index:1002;">
    新增规则时标题为「新增规则」；选择 Webhook / 双通道 时显示 Webhook 字段并启用校验。
    <a href="push-rule-drawer.html" style="color:var(--el-color-primary);margin-left:8px;">刷新</a>
  </div>

  <div class="proto-badge"><a href="index.html">← 原型索引</a> · P-FT-006 · 600px</div>
</body>
</html>
