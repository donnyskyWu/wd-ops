# Ops Server — Production Full Configuration Template
# Version: 2026-08-25
# Source: BOOT-INF/classes/application.yaml + application-prod.yaml + application-prod.snippet.yaml
# Usage: Nacos DataId ops-server-prod.yaml OR --spring.config.additional-location overlay
# Activate: --spring.profiles.active=prod
# SECURITY: Replace all REPLACE_* placeholders; never commit secrets to git.

spring:
  application:
    name: ops-server
  main:
    banner-mode: "off"
    allow-bean-definition-overriding: true
    allow-circular-references: true
  autoconfigure:
    exclude:
      - football.framework.security.config.FootballSecurityAutoConfiguration
      - football.framework.security.config.FootballWebSecurityConfigurerAdapter
      - football.framework.security.config.FootballSecurityRpcAutoConfiguration
      - football.framework.operatelog.config.FootballOperateLogConfiguration
      - football.framework.operatelog.config.FootballOperateLogRpcAutoConfiguration
      - football.framework.swagger.config.FootballSwaggerAutoConfiguration
      - football.framework.apilog.config.FootballApiLogRpcAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD}
      discovery:
        enabled: true
        register-enabled: true
        namespace: ${NACOS_NAMESPACE:prod}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        fail-fast: false
        failure-tolerance-enabled: true
        metadata:
          version: prod-ops-v189
      config:
        enabled: false
        import-check:
          enabled: false
    openfeign:
      client:
        config:
          default:
            connectTimeout: 10000
            readTimeout: 120000
  datasource:
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          url: jdbc:mysql://${OPS_DB_HOST}:${OPS_DB_PORT:3306}/${OPS_DB_NAME}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=true
          username: ${OPS_DB_USER}
          password: ${OPS_DB_PASSWORD}
          driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    out-of-order: true
    locations: classpath:db/migration
    table: flyway_schema_history
    ignore-migration-patterns: "*:missing"
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

server:
  port: 48094

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized
  health:
    defaults:
      enabled: true
    db:
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: NONE
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  type-aliases-package: football.module.ops.dal.dataobject

football:
  info:
    base-package: football.module.ops
  web:
    admin-ui:
      url: ${ADMIN_UI_URL}
  xss:
    enable: false
  access-log:
    enable: false
  security:
    mock-enable: false
  ai:
    scheme-generate-url: http://ai.author.shenyu.com/api/v1/tasks
    scheme-generate-api-key: pi-sk-9d49187d2ac7e2ad4b796fad
    scheme-get-url: http://ai.author.shenyu.com/api/v1/tasks
    model: deepseek-v4-flash
    poll-timeout-ms: 600000

oa:
  auth:
    gateway-login-user:
      enabled: true
    dev-token:
      enabled: false
    legacy-ds-token:
      enabled: false
    football-redis:
      enabled: true
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD}
  file:
    upload-dir: ${OA_UPLOAD_DIR:/opt/ops/data/uploads}
    max-file-size: 52428800
  crypto:
    aes-key: ${OA_AES_KEY}
  match:
    internal-base-url: ${OA_MATCH_INTERNAL_BASE_URL:http://match-server:48088}
    headers:
      tenant-id: "1"
  collect:
    schedule:
      enabled: ${OA_COLLECT_SCHEDULE_ENABLED:true}
      scan-cron: "0 * * * * ?"
    stub:
      force-fail: false
  unified-collector:
    base-url: http://ai.shenyu.com/
    api-token: bce3aa7b4922977ccb88063f2ee8ec137c1f5bff44890ba8cf5e35511cbfe434
    timeout-ms: 30000
    stub: false
  work-task:
    win-prediction:
      enabled: true
      match-end-buffer-minutes: 120
      scheduled-fallback-enabled: false
      scheduled-cron: "0 0 * * * ?"

xxl:
  job:
    enabled: ${XXL_JOB_ENABLED:true}
    accessToken: ${XXL_JOB_ACCESS_TOKEN:REPLACE_WITH_PROD_TOKEN}
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://127.0.0.1:9090/xxl-job-admin}
    executor:
      appname: football-ops-executor
      ip:
      port: -1
      logpath: ${user.home}/logs/xxl-job/ops-server
      logretentiondays: 30

logging:
  level:
    root: INFO
    football.module.ops: INFO
