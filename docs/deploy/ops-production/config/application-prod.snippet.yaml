# Ops Server — Production Configuration Snippet
# Version: 2026-08-19
# Source: application-prod.yaml + application.yaml (prod-relevant sections)
# Usage: merge into Nacos config or --spring.config.additional-location overlay
# Activate: --spring.profiles.active=prod

spring:
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD}
      discovery:
        namespace: ${NACOS_NAMESPACE:prod}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        namespace: ${NACOS_NAMESPACE:prod}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
  datasource:
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          url: jdbc:mysql://${OPS_DB_HOST}:${OPS_DB_PORT:3306}/${OPS_DB_NAME}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=true
          username: ${OPS_DB_USER}
          password: ${OPS_DB_PASSWORD}
          driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}

football:
  web:
    admin-ui:
      url: ${ADMIN_UI_URL}
  ai:
    # jingcai.article 异步生成 — set prod URLs/keys (not env-interpolated in base yaml)
    scheme-generate-url: https://ai.author.shenyu.com/api/v1/tasks   # REPLACE
    scheme-generate-api-key: REPLACE_WITH_PROD_KEY
    scheme-get-url: https://ai.author.shenyu.com/api/v1/tasks        # REPLACE
    model: deepseek-v4-flash
    poll-timeout-ms: 180000

oa:
  auth:
    gateway-login-user:
      enabled: true
    dev-token:
      enabled: false
    legacy-ds-token:
      enabled: false
    football-redis:
      enabled: true
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD}
  crypto:
    aes-key: ${OA_AES_KEY}
  # Match proxy — no schema change; MatchProxyService → match-server /match/match-data/**
  match:
    internal-base-url: http://match-server:48088   # REPLACE: Nacos service or prod literal
  unified-collector:
    base-url: ${COLLECTOR_BASE_URL}
    api-token: ${COLLECTOR_API_TOKEN:}
  collect:
    schedule:
      enabled: true
      scan-cron: "0 * * * * ?"
  work-task:
    win-prediction:
      enabled: true
      match-end-buffer-minutes: 120
      scheduled-fallback-enabled: false   # prod MUST use xxl-job
      scheduled-cron: "0 0 * * * ?"

--- #################### XXL-JOB (ADR-070) ####################

xxl:
  job:
    enabled: ${XXL_JOB_ENABLED:true}
    accessToken: ${XXL_JOB_ACCESS_TOKEN:a1b2c3d4e5f67890}
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://127.0.0.1:9090/xxl-job-admin}
    executor:
      appname: football-ops-executor
      ip:
      port: -1
      logpath: ${user.home}/logs/xxl-job/ops-server
      logretentiondays: 30
