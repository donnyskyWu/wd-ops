# member-server overlay for FullMemberServer local integration.
# author_user SSOT lives in shenyu-member (not wd). Shared football-integration-overlay.yml
# points system/mp at wd; member-server must override to shenyu-member or login Feign fails.
spring:
  datasource:
    dynamic:
      datasource:
        master:
          url: jdbc:mysql://localhost:3306/shenyu-member?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
          username: root
          password: root
        slave:
          url: jdbc:mysql://localhost:3306/shenyu-member?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
          username: root
          password: root

football:
  ai:
    scheme-generate-url: http://ai.author.shenyu.com/api/v1/tasks
    scheme-generate-api-key: ${AUTHOR_AI_SCHEME_API_KEY:CHANGE_ME}
    scheme-get-url: http://ai.author.shenyu.com/api/v1/tasks
