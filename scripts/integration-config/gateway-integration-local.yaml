# Gateway overlay for local integration: Nacos discovery + grayLb routes (from jar application.yaml).
# Routes are NOT overridden here — gateway-server JAR defines grayLb://system-server|ops-server|... .
# Requires local Nacos :8848 namespace local and all Football services registered before Gateway routes work.
spring:
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      username: ""
      password: ""
      discovery:
        namespace: local
        group: DEFAULT_GROUP
        register-enabled: true
        enabled: true
        fail-fast: false
        failure-tolerance-enabled: true
      config:
        enabled: false
    gateway:
      # AI 生成等长耗时接口需与前端 AI_GENERATE_TIMEOUT_MS（300s）对齐；默认 ~60s 会误报 500
      server:
        webflux:
          httpclient:
            response-timeout: 300s
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      password: 123456

logging:
  level:
    org.springframework.context.support.PostProcessorRegistrationDelegate: ERROR

