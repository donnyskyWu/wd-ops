# Shared overlay for Football S1-B integration (use with --spring.profiles.active=local).
# DEFAULT local path (start-ops-dev / start-integration-all): localhost MySQL + 127.0.0.1 Redis/Nacos.
# DB NOTE: 本地使用 shenyu-sys（从测试环境同步，2026-08-18 起替换 shenyu-system）。
# member/match override via their own overlays; mp-server still inherits this master unless overridden.
# Beta remote 110.42.49.224 = opt-in via football-integration-overlay-beta.yml + ops-test-remote.env (NOT this file).
# Archive remote 101.37.161.136 → football-integration-overlay-remote.yml (export/backup only).
# Feign: 默认 Nacos 发现；member-server.url 为 Nacos 未就绪时的本地直连兜底。
spring:
  autoconfigure:
    exclude:
      - org.apache.rocketmq.spring.autoconfigure.RocketMQAutoConfiguration
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        enabled: true
        register-enabled: true
        namespace: local
        group: DEFAULT_GROUP
        fail-fast: false
        failure-tolerance-enabled: true
        # Local integration: register 127.0.0.1 so gateway on same host does not route to stale LAN IP.
        ip: 127.0.0.1
        metadata:
          version: 1.0.0
      config:
        enabled: false
    openfeign:
      client:
        config:
          # Nacos 未就绪时，登录 createLoginLog 仍能通过 AuthorApi 直连 member-server :48087
          member-server:
            url: http://127.0.0.1:48087
  datasource:
    dynamic:
      datasource:
        master:
          url: jdbc:mysql://localhost:3306/shenyu-sys?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
          username: root
          password: root
        slave:
          url: jdbc:mysql://localhost:3306/shenyu-sys?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
          username: root
          password: root
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      password: 123456

rocketmq:
  name-server: 192.168.10.51:9876
  consumer:
    listeners:
      article-push-consumer-group:
        ARTICLE_PUSH_TOPIC: false
      MEMBER_BIZ_TOPIC_CONSUMER:
        MEMBER_BIZ_TOPIC: false


