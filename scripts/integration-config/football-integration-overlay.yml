# Shared overlay for Football S1-B integration (use with --spring.profiles.active=local).
# DB NOTE (2026-07-05): localhost five-DB stack for daily dev / GATE-MDB (ADR-050).
# Remote 101.37.161.136 URLs preserved in football-integration-overlay-remote.yml (export/backup only; not used by start-integration-all.ps1).
spring:
  autoconfigure:
    exclude:
      - org.apache.rocketmq.spring.autoconfigure.RocketMQAutoConfiguration
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        enabled: true
        register-enabled: true
        namespace: local
        group: DEFAULT_GROUP
        fail-fast: false
        failure-tolerance-enabled: true
        metadata:
          version: 1.0.0
      config:
        enabled: false
    openfeign:
      client:
        config:
          system-server:
            url: http://127.0.0.1:48081
          member-server:
            url: http://127.0.0.1:48087
          infra-server:
            url: http://127.0.0.1:48082
          mp-server:
            url: http://127.0.0.1:48086
  datasource:
    dynamic:
      datasource:
        master:
          url: jdbc:mysql://localhost:3306/wd?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
          username: root
          password: root
        slave:
          url: jdbc:mysql://localhost:3306/wd?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
          username: root
          password: root
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      password: 123456

