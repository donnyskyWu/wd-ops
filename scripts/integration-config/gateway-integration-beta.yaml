# Gateway overlay for beta test DBs: Nacos discovery (local 127.0.0.1:8848 namespace local) + remote Redis.
# Routes from jar application.yaml (grayLb://*) — no direct http://127.0.0.1:480xx overrides.
# Secrets: load ops-test-remote.env before start. See docs/delivery/OPS-TEST-DB.md
spring:
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      username: ""
      password: ""
      discovery:
        namespace: local
        group: DEFAULT_GROUP
        register-enabled: true
        enabled: true
        fail-fast: false
        failure-tolerance-enabled: true
      config:
        enabled: false
    gateway:
      server:
        webflux:
          httpclient:
            response-timeout: 300s
  data:
    redis:
      host: ${OPS_TEST_REDIS_HOST:110.42.49.224}
      port: ${OPS_TEST_REDIS_PORT:6379}
      database: ${OPS_TEST_REDIS_DATABASE:1}
      password: ${OPS_TEST_REDIS_PASSWORD:CHANGE_ME}

logging:
  level:
    org.springframework.context.support.PostProcessorRegistrationDelegate: ERROR

football:
