# Local Football integration: register member-server in Nacos namespace "local".
# Use ONLY profile "local-nacos" (includes local base config).

spring:

  autoconfigure:
    exclude:
      - org.apache.rocketmq.spring.boot.autoconfigure.RocketMQAutoConfiguration
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        enabled: true
        register-enabled: true
        namespace: local
        group: DEFAULT_GROUP
        fail-fast: false
        failure-tolerance-enabled: true
      config:
        enabled: false

  # ARCHIVE/STAGE template — daily integration uses football-integration-overlay.yml (localhost).
  datasource:
    dynamic:
      datasource:
        master:
          url: jdbc:mysql://localhost:3306/wd?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
          username: root
          password: root
        slave:
          url: jdbc:mysql://localhost:3306/wd?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
          username: root
          password: root

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      password: 123456