            ## ops-server 服务（Ops 运营数据平台）— ADR-058 P-C：/admin-api/ops/** 直挂，无 Rewrite
            - id: ops-admin-api
              uri: grayLb://ops-server
              predicates:
                - Path=/admin-api/ops/**
              metadata:
                response-timeout: 300000
                connect-timeout: 10000
              filters:
                - RewritePath=/admin-api/ops/v3/api-docs, /v3/api-docs
