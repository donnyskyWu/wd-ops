            ## live-server 服务
            - id: live-app-api # 路由的编号
              uri: grayLb://live-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/app-api/live/**
              filters:
                - RewritePath=/app-api/live/v3/api-docs, /v3/api-docs
            ## wecom-server 服务
            - id: wecom-admin-api # 路由的编号
              uri: grayLb://wecom-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
